<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order sent · AzuMar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#001A3E">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icono.png">
<link rel="preload" href="fuente-cinzel.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Chrome en Android con "Sitio de escritorio" dibuja la página a 980 px y la
  // achica: todo se ve diminuto. Aquí se detecta y se amplía la página al ancho
  // real del teléfono, con su diseño de celular (ver generar-modo-escritorio.py).
  (function () {
    var d = document.documentElement;
    function ajustar() {
      var w = screen.width, z = innerWidth / w;
      var activo = navigator.maxTouchPoints > 0 && w < 700 && z > 1.25;
      d.classList.toggle('modo-escritorio', activo);
      [899, 767, 599, 480, 380].forEach(function (n) { d.classList.toggle('mx-' + n, activo && w <= n); });
      d.style.zoom = activo ? z : '';
      if (activo) {
        var h = innerHeight / z / 100 + 'px';
        d.style.setProperty('--vw', w / 100 + 'px');
        ['--vh', '--dvh', '--svh'].forEach(function (p) { d.style.setProperty(p, h); });
      } else {
        ['--vw', '--vh', '--dvh', '--svh'].forEach(function (p) { d.style.removeProperty(p); });
      }
    }
    ajustar();
    addEventListener('resize', ajustar);
  })();
</script>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="modo-escritorio.css">
</head>
<body class="pagina-gracias">
<main class="gracias">
  <img class="gracias-logo" src="logo-azumar-360.webp" alt="AzuMar" width="360" height="307">
  <svg class="gracias-sello" viewBox="0 0 256 256" aria-hidden="true"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
  <h1>Your order is on its way to AzuMar</h1>
  <p>Check that the message was sent in your WhatsApp. As soon as we get it, we’ll reply there to confirm your order and the delivery time.</p>

  <!-- Si el navegador bloqueó la ventana de WhatsApp, el pedido no se pierde. -->
  <div class="gracias-fallo" id="fallo" hidden>
    <p>WhatsApp didn’t open?</p>
    <a class="boton boton-oro" id="reintentar" href="#" target="_blank" rel="noopener">Open WhatsApp with my order</a>
  </div>

  <nav class="portada-botones gracias-acciones" aria-label="What to do next">
    <a class="boton boton-linea" href="pedido-en.html">Place another order</a>
    <a class="boton boton-linea" href="en.html">Back to home</a>
  </nav>
  <p class="gracias-contacto"><a href="tel:+50687758360">+506 8775-8360</a> · Noon to 11 pm · Quepos</p>
</main>
<script>
  // El enlace de WhatsApp se guardó justo antes de salir del pedido. Si no se
  // abrió (bloqueador de ventanas, o se cerró sin querer), aquí se reintenta.
  // Lleva nombre, teléfono y dirección: al salir de esta página se borra.
  (function () {
    try {
      var enlace = sessionStorage.getItem('azumar-ultimo-pedido');
      if (enlace) {
        document.getElementById('reintentar').href = enlace;
        document.getElementById('fallo').hidden = false;
      }
    } catch (e) { /* modo privado: sin respaldo, la página funciona igual */ }
    function olvidar() { try { sessionStorage.removeItem('azumar-ultimo-pedido'); } catch (e) {} }
    document.querySelectorAll('.gracias-acciones a').forEach(function (a) { a.addEventListener('click', olvidar); });
    window.addEventListener('pagehide', olvidar);
  })();
</script>
</body>
</html>
