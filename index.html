<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AzuMar · Menú · Menu</title>
<meta name="description" content="Menú del Restaurante y Marisquería AzuMar en Quepos, Costa Rica. Elegí tu idioma. AzuMar Restaurant and Seafood House menu. Choose your language.">
<meta name="theme-color" content="#001A3E">

<meta property="og:type" content="website">
<meta property="og:title" content="Menú AzuMar · AzuMar Menu">
<meta property="og:description" content="Restaurante y Marisquería AzuMar, Quepos, Costa Rica.">
<meta property="og:image" content="logo.webp">

<link rel="icon" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preload" as="image" href="logo-limpio.webp">
<link rel="preload" as="image" href="fondo-bienvenida.webp">

<style>
  :root{
    --navy:#001A3E;
    --navy-2:#0F2A52;
    --gold:#D6A93B;
    --gold-soft:#E8C978;
    --paper:#F4EFE4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* Un elemento con `hidden` NO se ve, y punto. Sin esto, cualquier regla de
     clase con display:flex le gana al hidden del navegador: las opciones de
     idioma del Express salían abiertas desde el principio. */
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    /* Alto exacto de la pantalla, no mínimo: así nada queda por debajo del
       borde. En pantallas bajitas todo se aprieta en vez de cortarse. */
    height:100svh;
    background:var(--navy);
    color:var(--paper);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(14px,3.5vh,32px) 22px calc(clamp(14px,3.5vh,32px) + env(safe-area-inset-bottom));
    gap:clamp(12px,2.8vh,26px);
    overflow:hidden;
  }

  /* Un plato de la casa de fondo, muy oscurecido. Una pantalla de puro
     texto no dice "aquí se come bien"; una foto sí, aunque apenas se
     adivine. Va difuminada y bajo un velo azul para que nunca compita con
     el logo ni con los botones. */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url("fondo-bienvenida.webp") center/cover no-repeat;
    opacity:.55;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse 62% 46% at 50% 34%,
        rgba(0,26,62,.97) 35%, rgba(0,26,62,.88) 62%, rgba(0,26,62,.60) 100%),
      linear-gradient(180deg, rgba(0,26,62,.55), rgba(0,26,62,.30) 40%, rgba(0,26,62,.92));
  }
  /* display:contents deja que los hijos sean los que se reparten el alto,
     así que el z-index se le pone a cada uno, no al envoltorio. */
  .contenido{display:contents}
  .franja-logo,.bloque-texto,.idiomas,.bloque-express,.estado,.pie{position:relative;z-index:2}

  /* El logo trae su propio fondo azul marino, casi igual al de la página.
     Por eso va sin marco ni recorte: se funde con el fondo y se lee como
     el logo suelto, no como una calcomanía pegada encima.

     Va en una franja flexible: es lo ÚNICO que cede espacio. Si la pantalla
     es bajita el logo se achica, pero los textos y los botones de idioma
     nunca quedan cortados — que era justo el problema. */
  /* La franja NO se queda con todo el espacio sobrante: si lo hace, en un
     teléfono alto el logo se ve chiquito en medio de un hueco enorme y los
     textos quedan apretados abajo. Con flex:0 1 auto el grupo entero se
     centra, y el logo sigue siendo lo ÚNICO que se encoge cuando la pantalla
     es bajita, que era el problema original. */
  .franja-logo{
    /* Crece con el espacio que sobre, PERO no más de lo que el logo puede
       ocupar: el logo es cuadrado y su ancho está topado en 62vw, así que
       más alto que eso solo sería hueco. Ese hueco era lo que se veía en el
       teléfono. Y sigue encogiendo cuando la pantalla es bajita, que es lo
       que evita que los botones queden cortados. */
    flex:1 1 auto;
    min-height:0;
    max-height:min(300px,62vw,40vh);
    display:flex;align-items:center;justify-content:center;
    width:100%;
  }
  .logo{
    /* El tope de alto va atado a SU FRANJA (100%), no a la pantalla. Atado
       a vh, cuando la franja se encogía el logo no la seguía: se salía por
       arriba y por abajo y se le montaba al texto. */
    max-height:100%;
    max-width:min(300px,62vw);
    width:auto;height:auto;display:block;
    object-fit:contain;
    filter:drop-shadow(0 14px 32px rgba(0,0,0,.55));
  }

  h1{
    font-size:clamp(17px,min(5.2vw,3.4vh),26px);
    font-weight:600;line-height:1.35;
    letter-spacing:.01em;
    max-width:19ch;
  }
  h2{
    font-size:clamp(13.5px,min(4.2vw,2.5vh),19px);
    font-weight:400;line-height:1.4;
    color:var(--gold-soft);
    max-width:24ch;
  }
  .separador{
    width:64px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(214,169,59,.7),transparent);
  }

  .idiomas{
    display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);
    width:min(340px,100%);
  }
  .idiomas a{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:clamp(12px,2vh,17px) 22px;
    font-size:16px;font-weight:600;letter-spacing:.03em;
    text-decoration:none;
    border-radius:999px;
    transition:transform .12s ease, background .18s ease, color .18s ease;
  }
  /* El botón de español va relleno: es el idioma de la mayoría */
  .idiomas .es{background:var(--gold);color:var(--navy)}
  .idiomas .en{
    background:rgba(255,255,255,.04);
    color:var(--gold-soft);
    border:1px solid rgba(214,169,59,.45);
  }
  .idiomas a:hover{transform:translateY(-1px)}
  .idiomas .es:hover{background:var(--gold-soft)}
  .idiomas .en:hover{background:rgba(214,169,59,.16)}
  .idiomas a:active{transform:scale(.98)}
  .idiomas a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .bandera{font-size:19px;line-height:1}

  .estado{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--gold-soft);
    padding:7px 15px;
    border-radius:999px;
    background:rgba(0,26,62,.55);
    border:1px solid rgba(214,169,59,.28);
  }
  .estado::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .estado.abierto{color:#8FD694;border-color:rgba(143,214,148,.35)}

  /* Express: se ve claro, pero no le compite al menú. Quien escanea el QR
     en la mesa quiere la carta; quien pide a la casa busca esto. */
  .bloque-express{
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(7px,1.2vh,10px);
    width:min(340px,100%);
  }
  .boton-express{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;
    padding:clamp(10px,1.7vh,14px) 20px;
    font-size:14.5px;font-weight:600;letter-spacing:.02em;
    font-family:inherit;
    color:var(--gold);
    background:none;
    border:1px dashed rgba(214,169,59,.55);
    border-radius:999px;
    cursor:pointer;
    transition:background .16s ease,border-color .16s ease;
  }
  .boton-express:hover{background:rgba(214,169,59,.12);border-color:var(--gold)}
  .boton-express:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .boton-express[aria-expanded="true"]{border-style:solid;background:rgba(214,169,59,.1)}
  .moto{font-size:18px;line-height:1}

  .idiomas-express{display:flex;gap:8px;width:100%}
  .idiomas-express a{
    flex:1;
    padding:11px 10px;
    font-size:13.5px;font-weight:600;
    color:var(--navy);background:var(--gold);
    text-decoration:none;text-align:center;
    border-radius:999px;
  }
  .idiomas-express a:hover{background:var(--gold-soft)}
  .idiomas-express a:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  .pie{
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(244,239,228,.45);
    line-height:clamp(1.5,3vh,1.9);
  }
  .pie a{color:var(--gold-soft);text-decoration:none}
  .pie a:hover{text-decoration:underline}

  /* En pantallas muy bajitas ya no queda sitio para el logo sin apretar los
     botones. Un logo de 16px parece un error, no una marca: mejor quitarlo y
     dejar el espacio para lo que el cliente necesita tocar. */
  @media (max-height:540px){
    .franja-logo{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    .idiomas a{transition:none}
  }
</style>
</head>
<body>
  <div class="contenido">
    <div class="franja-logo">
      <img class="logo" src="logo-limpio.webp" alt="AzuMar, del mar a tu mesa" width="260" height="260" fetchpriority="high">
    </div>

    <div class="bloque-texto">
      <h1>Bienvenidos al Restaurante y Marisquería AzuMar</h1>
      <div class="separador" style="margin:clamp(8px,1.8vh,16px) auto"></div>
      <h2>Welcome to AzuMar Restaurant and Seafood House.</h2>
    </div>

    <nav class="idiomas" aria-label="Elegí el idioma del menú · Choose the menu language">
      <a class="es" href="es.html" hreflang="es">
        <span class="bandera" aria-hidden="true">🇨🇷</span>
        Ver el menú en Español
      </a>
      <a class="en" href="en.html" hreflang="en">
        <span class="bandera" aria-hidden="true">🇺🇸</span>
        View the menu in English
      </a>
    </nav>

    <div class="bloque-express">
      <button class="boton-express" id="boton-express" type="button"
              aria-expanded="false" aria-controls="idiomas-express">
        <span class="moto" aria-hidden="true">🛵</span>
        Pedir Express · Order delivery
      </button>
      <div class="idiomas-express" id="idiomas-express" hidden>
        <a href="express.html" hreflang="es">Español</a>
        <a href="express-en.html" hreflang="en">English</a>
      </div>
    </div>

    <p class="estado" id="estado" hidden></p>

    <p class="pie">
      Quepos, Costa Rica<br>
      12 md a 11 pm · Express<br>
      <a href="tel:+50687758360">8775-8360</a><br>
      <a href="legal.html">Términos y privacidad</a>
    </p>
  </div>
<script>
  // Abierto o cerrado según la hora DE COSTA RICA, no la del teléfono.
  // Un turista recién llegado con el reloj en otro huso vería "cerrado"
  // a las ocho de la noche y se iría a comer a otra parte.
  (function () {
    var caja = document.getElementById("estado");
    try {
      var hora = Number(new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Costa_Rica", hour: "numeric", hour12: false
      }).format(new Date()));
      var abierto = hora >= 12 && hora < 23;
      caja.textContent = abierto
        ? "Abierto ahora · Open now"
        : "Cerrado · abrimos a las 12 md";
      if (abierto) caja.classList.add("abierto");
      caja.hidden = false;
    } catch (e) {
      /* navegador sin husos horarios: mejor no decir nada que mentir */
    }
  })();

  // Express: un solo toque y lo único que pregunta es el idioma.
  (function () {
    var boton = document.getElementById("boton-express");
    var opciones = document.getElementById("idiomas-express");
    boton.addEventListener("click", function () {
      var abierto = boton.getAttribute("aria-expanded") === "true";
      boton.setAttribute("aria-expanded", abierto ? "false" : "true");
      opciones.hidden = abierto;
      if (!abierto) opciones.querySelector("a").focus();
    });
  })();
</script>
</body>
</html>
