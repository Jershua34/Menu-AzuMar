<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>Menú · AZU MAR — Del mar a tu mesa</title>
<meta name="description" content="Menú de AZU MAR: ceviches, mariscos, arroces, cortes de carne, menú ejecutivo, batidos naturales y menú infantil. Impuestos de ley ya incluidos.">
<meta name="theme-color" content="#001A3E">
<meta name="apple-mobile-web-app-title" content="AZU MAR">
<meta property="og:type" content="website">
<meta property="og:title" content="Menú AZU MAR">

<style>
  :root{
    --navy:#001A3E;
    --navy-2:#0F2A52;
    --gold:#D6A93B;
    --gold-soft:#E8C978;
    --paper:#F4EFE4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--navy);
    color:var(--paper);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }

  /* ---------- Encabezado ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(0,26,62,.95);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid rgba(214,169,59,.28);
    padding-top:env(safe-area-inset-top);
  }
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px 6px}
  .bar img{height:38px;width:auto;display:block}
  .bar .tag{
    margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);opacity:.9;white-space:nowrap
  }

  /* ---------- Navegación por secciones ---------- */
  nav{
    display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none}
  nav a{
    flex:0 0 auto;
    font-size:13px;font-weight:600;letter-spacing:.03em;
    color:var(--gold-soft);text-decoration:none;white-space:nowrap;
    padding:7px 13px;border:1px solid rgba(214,169,59,.4);border-radius:999px;
    background:rgba(255,255,255,.03);
    transition:background .15s ease,color .15s ease;
  }
  nav a:active{background:var(--gold);color:var(--navy)}

  /* ---------- Páginas del menú ---------- */
  main{max-width:820px;margin:0 auto;padding:10px 10px 0}
  section{scroll-margin-top:104px}
  section img{
    width:100%;height:auto;display:block;
    border-radius:14px;
    margin-bottom:12px;
    background:var(--navy-2);
    box-shadow:0 6px 22px rgba(0,0,0,.4);
  }

  /* ---------- Pie ---------- */
  footer{
    text-align:center;padding:26px 18px calc(34px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(214,169,59,.22);margin-top:14px;
  }
  footer .pdf{
    display:inline-block;
    font-size:14px;font-weight:600;letter-spacing:.04em;
    color:var(--navy);background:var(--gold);
    text-decoration:none;padding:12px 26px;border-radius:999px;
  }
  footer p{margin-top:14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);opacity:.75}

  /* ---------- Botón volver arriba ---------- */
  #top{
    position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(214,169,59,.5);
    background:rgba(0,26,62,.9);color:var(--gold);
    font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #top.on{opacity:1;pointer-events:auto}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
